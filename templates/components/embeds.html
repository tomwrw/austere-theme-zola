{# Embed components for use in content #}

{# {{ <youtube id="dQw4w9WgXcQ"/> }} or {{ <youtube id="dQw4w9WgXcQ" autoplay={true}/> }} #}
{% component youtube(id, autoplay = false) -%}
<div class="yt"><iframe src="https://www.youtube.com/embed/{{id}}{% if autoplay %}?autoplay=1{% endif %}" allowfullscreen></iframe></div>
{%- endcomponent youtube %}

{# {{ <spotify id="album-id"/> }} #}
{% component spotify(id) -%}
<iframe src="https://open.spotify.com/embed/album/{{id}}" width="300" height="380" style="display:block;margin:0 auto 1.5rem;border:0" allow="encrypted-media"></iframe>
{%- endcomponent spotify %}
